*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0d0712}
#fit{position:fixed;inset:0;display:grid;place-items:center;background:#0d0712 var(--room) center/cover}
#fit:before{content:'';position:absolute;inset:0;background:rgba(13,7,18,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;border-radius:18px;background:var(--night);box-shadow:0 0 0 4px var(--paper),0 0 0 9px var(--ink),0 30px 90px #000c;font:22px/1.35 'Patrick Hand',system-ui,sans-serif;color:var(--ink);cursor:var(--cur);-webkit-user-select:none;user-select:none}
#stage:fullscreen{border-radius:0}
h1,h2,h3{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
#rot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;text-align:center;background:#150c1dee;color:var(--paper);font:28px 'Patrick Hand',sans-serif;padding:30px}
#scr{position:absolute;inset:0;--mx:0;--my:0}
.par{translate:calc(var(--mx)*var(--d,0)*1px) calc(var(--my)*var(--d,0)*.6px);transition:translate .25s ease-out}
/* ---------- backgrounds ---------- */
.bg{position:absolute;inset:-14px;background:#231430 center/cover}
.bg.room{background-image:var(--room)}
.bg svg{position:absolute;inset:0;width:100%;height:100%;filter:url(#wob2)}
.bg.dr:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(20,8,30,.55)),linear-gradient(160deg,rgba(255,160,100,.3),rgba(70,30,95,.5));mix-blend-mode:multiply}
.bg.fade{animation:fadein .7s both}
.shade{position:absolute;inset:0;background:linear-gradient(rgba(25,10,35,.1) 45%,rgba(20,8,30,.75));pointer-events:none}
@keyframes fadein{from{opacity:0}}
/* ---------- sprites ---------- */
.spr{position:absolute;transform-origin:50% 100%;transition:filter .4s,scale .4s;pointer-events:none}
.spr .in{height:100%;transform-origin:50% 100%;animation:idle 2.8s ease-in-out infinite}
.spr svg{height:100%;width:auto;display:block;filter:url(#wob)}
.spr.spk{filter:brightness(1.08) drop-shadow(0 0 18px rgba(255,205,140,.55));scale:1.04;z-index:2}
.spr.dim{filter:brightness(.42) saturate(.6);scale:.96}
.spr.nar{filter:brightness(.78)}
.spr.talk .in{animation:talk .26s ease-in-out infinite alternate}
.spr.yay{animation:yay .75s}.spr.no{animation:shake .5s}
.spr.out{opacity:0;transition:opacity .35s}
@keyframes idle{50%{transform:scale(1.012,.978)}}
@keyframes talk{to{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes yay{30%{transform:translateY(-60px) rotate(-6deg)}55%{transform:translateY(0) scale(1.06,.9)}75%{transform:translateY(-22px)}}
@keyframes shake{20%,60%{transform:translateX(-10px) rotate(-3deg)}40%,80%{transform:translateX(10px) rotate(3deg)}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}}
/* ---------- iris wipe ---------- */
#iris{position:absolute;inset:0;z-index:80;pointer-events:none;overflow:hidden}
#iris.shut{pointer-events:auto}
#iris i{position:absolute;left:640px;top:360px;width:3200px;height:3200px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 12px var(--mus),0 0 0 2400px var(--night);transition:width .5s cubic-bezier(.6,0,.35,1),height .5s cubic-bezier(.6,0,.35,1)}
#iris.shut i{width:0;height:0}
/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;height:70px;z-index:30;display:flex;align-items:center;gap:12px;padding:0 20px;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
#hud.off{transform:translateY(-90px)}
.pill{display:flex;align-items:baseline;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 20px 4px;font:600 21px 'Fredoka',sans-serif;box-shadow:0 4px 0 var(--sh)}
.pill.g{background:var(--grn)}.pill small{font:13px 'Special Elite',monospace;opacity:.7}
.pill.bump{animation:popin .5s}
.ib{width:50px;height:50px;border-radius:50%;background:var(--plum);border:3px solid var(--paper);font-size:22px;box-shadow:0 4px 0 var(--sh);transition:transform .15s}
.ib:hover{transform:translateY(-3px) rotate(-8deg)}.ib:active{transform:translateY(2px)}
/* ---------- buttons ---------- */
.btn{font:600 21px 'Fredoka',sans-serif;background:var(--mus);border:3px solid var(--ink);border-radius:999px;padding:8px 24px;min-height:48px;box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover:not([disabled]){transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.g{background:var(--grn)}.btn.b{background:var(--white)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.s{font-size:16px;min-height:36px;padding:3px 14px;box-shadow:0 3px 0 var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}.row.c{justify-content:center}.row.end{margin-top:auto;justify-content:flex-end;padding-top:12px}
.sp{flex:1}
.link{background:none;border:0;text-decoration:underline;font-size:20px}
/* ---------- toast ---------- */
#toast{position:absolute;top:78px;left:50%;z-index:70;transform:translate(-50%,-30px);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.3,1.5,.5,1);background:var(--plum);color:var(--paper);border:3px solid var(--paper);border-radius:999px;padding:8px 26px;font-size:22px;box-shadow:0 5px 0 var(--sh);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- main menu ---------- */
.menu .bg{inset:-30px}
.menu .mshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(21,12,29,.88) 0,rgba(21,12,29,.55) 38%,transparent 62%),linear-gradient(transparent 60%,rgba(21,12,29,.7))}
.rays{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 70px,rgba(255,190,120,.09) 70px 110px,transparent 110px 190px);mask-image:linear-gradient(120deg,transparent 30%,#000 60%,transparent 95%);-webkit-mask-image:linear-gradient(120deg,transparent 30%,#000 60%,transparent 95%);animation:rays 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes rays{to{opacity:.45;transform:translateX(26px)}}
.motes i{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe6b0;box-shadow:0 0 10px 3px rgba(255,210,140,.7);opacity:0;animation:mote linear infinite}
@keyframes mote{10%{opacity:.9}90%{opacity:.7}100%{transform:translate(60px,-260px);opacity:0}}
.logo{position:absolute;left:70px;top:50px;transform:rotate(-4deg)}
.logo div{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;line-height:.95;letter-spacing:1px;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 8px 0 var(--sh))}
.logo .l1{font-size:92px;color:var(--paper)}.logo .l2{font-size:158px;color:var(--mus);margin-left:54px}
.logo b{display:inline-block;animation:letter .7s cubic-bezier(.3,1.6,.5,1) both,float 3s ease-in-out infinite;animation-delay:calc(var(--i)*70ms),calc(var(--i)*-.35s + 1s)}
@keyframes letter{from{transform:translateY(-140px) rotate(20deg);opacity:0}}@keyframes float{50%{translate:0 -7px}}
.logo .gl{position:absolute;right:-74px;bottom:54px;font-size:78px;animation:peek 4s ease-in-out infinite;-webkit-text-stroke:0;filter:drop-shadow(0 5px 0 var(--sh))}
@keyframes peek{50%{transform:translate(-18px,8px) rotate(-18deg)}}
.logo p{margin:6px 0 0 62px;display:inline-block;font:24px 'Special Elite',monospace;color:var(--ink);background:var(--paper);border:3px solid var(--ink);padding:6px 16px 2px;transform:rotate(2deg);box-shadow:0 5px 0 var(--sh);animation:popin .5s .9s both}
.mm{position:absolute;left:84px;top:372px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.mm button{position:relative;width:310px;text-align:left;font:700 28px 'Fredoka',sans-serif;background:var(--paper);border:4px solid var(--ink);border-radius:10px 22px 10px 22px;padding:9px 22px;box-shadow:0 6px 0 var(--ink);transition:transform .16s cubic-bezier(.3,1.6,.5,1),background .16s;animation:slidein .5s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--i)*90ms + .7s)}
.mm button:nth-child(odd){rotate:-1.2deg}.mm button:nth-child(even){rotate:1deg}
.mm button:after{content:'🪶';position:absolute;right:14px;top:7px;opacity:0;transform:translateX(-16px) rotate(-30deg);transition:.2s}
.mm button:hover{transform:translateX(26px) scale(1.05);background:var(--mus)}.mm button:hover:after{opacity:1;transform:rotate(0)}
.mm button:active{transform:translateX(26px) translateY(4px);box-shadow:0 2px 0 var(--ink)}
.mm .pri{background:var(--mus);width:340px;font-size:32px}
@keyframes slidein{from{transform:translateX(-420px);opacity:0}}
.menu .spr.duck{right:250px;bottom:-30px;height:500px}.menu .spr.pip{right:40px;bottom:-24px;height:400px}
.menu .spr{animation:rise .8s cubic-bezier(.3,1.3,.5,1) .4s both}.menu .spr.pip{animation-delay:.6s}
@keyframes rise{from{transform:translateY(520px)}}
.mnote{position:absolute;right:300px;top:74px;width:170px;background:var(--mus);padding:16px 14px 12px;font-size:24px;line-height:1.15;text-align:center;rotate:6deg;box-shadow:0 6px 0 var(--sh);animation:popin .5s 1.2s both,sway 4s ease-in-out 1.8s infinite;transform-origin:50% 0}
.mnote:before{content:'';position:absolute;top:-12px;left:50%;width:70px;height:22px;background:var(--tape);transform:translateX(-50%) rotate(-4deg)}
@keyframes sway{50%{transform:rotate(-5deg)}}
.hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:var(--paper);opacity:.7;font:15px 'Special Elite',monospace}
/* ---------- visual novel ---------- */
.vn{cursor:pointer}
.vn .spr{height:600px;bottom:-30px;transform:translateX(-50%);transition:left .5s,filter .4s,scale .4s,opacity .35s}
.vn .spr.sm{height:400px;bottom:180px}.vn .spr.in0{animation:fadein .45s}
.vbox{position:absolute;left:90px;right:90px;bottom:26px;z-index:5;padding:28px 26px 12px 62px;border:4px solid var(--ink);border-radius:6px 18px 8px 16px;box-shadow:0 7px 0 var(--sh);background:radial-gradient(circle at 28px 18px,var(--plum) 0 7px,transparent 8px) 0 8px/56px 36px repeat-y,linear-gradient(90deg,transparent 50px,rgba(232,93,117,.45) 50px 52px,transparent 52px),linear-gradient(transparent 33px,rgba(63,165,156,.25) 33px) 0 26px/100% 35px,var(--paper);animation:boxin .5s cubic-bezier(.3,1.3,.5,1) both}
@keyframes boxin{from{transform:translateY(240px)}}
.vname{position:absolute;top:-30px;left:26px;font:700 36px/1.15 'Caveat','Patrick Hand',cursive;color:#5b3fa0;background:var(--white);border:4px solid var(--ink);border-radius:5px 14px 5px 12px;padding:1px 24px 0;rotate:-2deg;box-shadow:0 4px 0 var(--sh);white-space:nowrap}
.vname[data-w=pip]{color:#2f7a3a}.vname[data-w=nar]{color:#75624e}
.vname.pop{animation:popin .35s}
.vclip{position:absolute;top:-18px;right:40px;width:34px;height:26px;background:var(--ink);border-radius:4px 4px 8px 8px}
.vclip:before{content:'';position:absolute;left:8px;top:-12px;width:12px;height:14px;border:4px solid #9aa3a6;border-bottom:0;border-radius:9px 9px 0 0}
.vtxt{font-size:28px;line-height:35px;min-height:70px}
#vt2{visibility:hidden}
.vtxt.end:after{content:'▼';display:inline-block;margin-left:8px;font-size:16px;color:var(--red);animation:bob 1s infinite}
.vrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.dots{display:flex;gap:6px}.dots i{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);background:var(--white);transition:.3s}.dots i.on{background:var(--teal)}
.vbtns{display:flex;gap:8px;margin-left:auto}
.vbtns button,.vhist{font:15px 'Special Elite',monospace;background:var(--paper2);border:3px solid var(--ink);border-radius:6px 11px 6px 11px;padding:6px 14px 3px;box-shadow:0 3px 0 var(--ink);transition:transform .12s}
.vbtns button:hover,.vhist:hover{transform:translateY(-2px)}.vbtns .nx{background:var(--mus);font-size:18px}.vbtns .on{background:var(--grn)}
.vhist{position:absolute;top:18px;right:20px;z-index:6;background:var(--paper)}
/* ---------- town map ---------- */
.town{position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,#c4e0a0 0 120px,transparent 121px),radial-gradient(circle at 78% 82%,#c4e0a0 0 160px,transparent 161px),radial-gradient(rgba(0,0,0,.05) 1.5px,transparent 2px) 0 0/18px 18px,#b3d691}
.town>svg{position:absolute;inset:0;width:100%;height:100%}
.town:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(40,15,60,.4)),linear-gradient(140deg,rgba(255,170,110,.22),rgba(110,60,140,.22));mix-blend-mode:multiply;z-index:9}
.de{position:absolute;font-size:46px;transform:translate(-50%,-80%);filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.de.t{animation:tree 3.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes tree{50%{rotate:2.5deg}}
.de.q{font-size:26px;animation:swim 9s linear infinite}@keyframes swim{50%{translate:120px 0}50.01%{translate:120px 0;scale:-1 1}99.99%{scale:-1 1}}
.cloud{position:absolute;top:0;left:-240px;width:210px;height:60px;border-radius:60px;background:rgba(255,255,255,.55);filter:blur(3px);animation:cloud linear infinite;z-index:8;pointer-events:none}
@keyframes cloud{to{transform:translateX(1700px)}}
.bd{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;text-align:center;z-index:4}
.bd .pl{position:absolute;left:50%;top:58px;width:150px;height:46px;border-radius:50%;background:rgba(60,40,20,.18);transform:translateX(-50%)}
.bd .ic{position:relative;display:block;font-size:88px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.25));transition:transform .2s}
.bd:hover .ic{transform:scale(1.1) rotate(-4deg)}
.bd b{position:absolute;top:-12px;right:-6px;width:38px;height:38px;border-radius:50%;background:var(--white);border:3px solid var(--ink);font:600 18px/32px 'Fredoka',sans-serif}
.bd small{position:relative;display:inline-block;margin-top:2px;white-space:nowrap;font:600 19px 'Fredoka',sans-serif;background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:1px 16px;box-shadow:0 3px 0 var(--sh)}
.bd.done b{background:var(--grn)}.bd.lock{filter:grayscale(1) brightness(.85);opacity:.75}
.bd.now .ic{animation:bob 1s infinite}.bd.now b{background:var(--mus)}
.bd.now .pl{background:rgba(255,207,92,.55);box-shadow:0 0 0 0 rgba(255,207,92,.7);animation:ring 1.4s infinite}
@keyframes ring{to{box-shadow:0 0 0 26px rgba(255,207,92,0)}}
.wd{position:absolute;z-index:6;height:112px;transform:translate(-50%,-92%);pointer-events:none}
.wd:before{content:'';position:absolute;left:50%;bottom:0;width:66px;height:16px;border-radius:50%;background:rgba(0,0,0,.25);transform:translateX(-50%)}
#wf,.wb{height:100%}.wb svg{height:100%;width:auto;display:block}
.wb.mv{animation:wk .3s infinite}@keyframes wk{50%{transform:translateY(-7px) rotate(5deg)}}
.ent{position:absolute;z-index:12;transform:translate(-50%,0);white-space:nowrap;animation:popin .3s}
.ban{position:absolute;top:84px;left:50%;z-index:10;transform:translateX(-50%) rotate(-1.5deg);background:var(--tape);padding:6px 30px 2px;font:26px 'Special Elite',monospace;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.nxt{position:absolute;right:22px;top:118px;z-index:10;width:330px;background:var(--paper);border:4px solid var(--ink);border-radius:6px 18px 18px 6px;padding:22px 18px 12px;box-shadow:0 6px 0 var(--sh);animation:slidein .5s both}
.nxt p{margin:4px 0 0}.nxt h3{font-size:28px}
.tag{position:absolute;top:-34px;left:20px;height:34px;padding:7px 20px 0;background:var(--pink);border:4px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;font:17px 'Special Elite',monospace;white-space:nowrap}
.keys{position:absolute;right:22px;bottom:20px;z-index:10;display:flex;gap:6px;align-items:center;color:var(--paper);font:15px 'Special Elite',monospace;background:rgba(21,12,29,.6);border-radius:12px;padding:8px 14px}
.keys kbd{font:600 15px 'Fredoka',sans-serif;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:1px 8px;box-shadow:0 2px 0 var(--ink)}
/* ---------- level frame ---------- */
.lv .spr.duck{left:70px;bottom:-46px;height:440px}.lv .spr.pip{left:292px;bottom:-34px;height:300px}
.bub{position:absolute;left:26px;top:96px;width:400px;min-height:96px;z-index:5;background:var(--white);border:4px solid var(--ink);border-radius:24px;padding:22px 20px 14px;font-size:23px;line-height:1.3;box-shadow:0 6px 0 var(--sh);animation:popin .45s both}
.bub:after{content:'';position:absolute;left:120px;bottom:-26px;width:34px;height:34px;background:var(--white);border:solid var(--ink);border-width:0 4px 4px 0;transform:rotate(45deg) skew(12deg,12deg);border-radius:0 0 8px 0}
.bub .nm{position:absolute;top:-22px;left:18px;font:700 27px/1.15 'Caveat','Patrick Hand',cursive;color:#5b3fa0;background:var(--tape);padding:1px 18px 0;rotate:-2deg;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.panel{position:absolute;left:456px;top:108px;width:800px;height:592px;display:flex;flex-direction:column;padding:26px 28px 20px;border:4px solid var(--ink);border-radius:6px 20px 20px 6px;box-shadow:0 8px 0 var(--sh),inset 9px 0 0 rgba(0,0,0,.05);background:linear-gradient(transparent 31px,rgba(63,165,156,.14) 31px) 0 14px/100% 33px,var(--paper);animation:panin .6s cubic-bezier(.3,1.25,.5,1) both}
@keyframes panin{from{transform:translateX(900px) rotate(6deg)}}
#pin{flex:1;display:flex;flex-direction:column;min-height:0}
.pp{background-color:var(--white);background-image:linear-gradient(transparent calc(100% - 2px),rgba(63,165,156,.3) 0);background-size:100% 1lh;background-origin:content-box;border:3px solid var(--ink);border-radius:5px;padding:14px 18px;font-size:25px;line-height:1.9}
.kw{font:inherit;background:none;border:0;border-bottom:4px dashed var(--red);padding:0 2px;border-radius:5px;transition:background .2s,transform .15s}
.kw:hover{background:rgba(255,207,92,.45);transform:scale(1.08)}.kw.f{background:var(--mus);border-bottom-color:transparent}
#cnt{font:600 22px 'Fredoka',sans-serif}
/* magnifier popup */
.lens{position:relative;width:560px;height:560px;animation:popin .4s cubic-bezier(.3,1.4,.5,1)}
.glass{position:absolute;left:40px;top:0;width:430px;height:430px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 12%,transparent 13%),var(--white);border:14px solid var(--mus);outline:5px solid var(--ink);box-shadow:inset 0 0 0 5px var(--ink),0 10px 0 var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px}
.glass .em{font-size:104px;line-height:1.1;animation:bob 1.6s infinite}.glass h2{font-size:46px}.glass p{font-size:27px;margin:8px 0 0;line-height:1.2}
.lens .hd{position:absolute;left:392px;top:372px;width:170px;height:44px;background:#c98a3c;border:5px solid var(--ink);border-radius:8px 22px 22px 8px;transform:rotate(45deg);transform-origin:0 50%;box-shadow:0 6px 0 var(--sh)}
.lens .row{position:absolute;left:0;bottom:8px;width:440px}
/* stage 2 */
.m2{display:flex;gap:18px;flex:1;min-height:0}.m2 .pp{flex:1;font-size:27px}
.tlb{flex:0 0 150px;display:flex;flex-direction:column;align-items:center}
.tl{width:92px;padding:12px 0;background:var(--ink);border-radius:22px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 6px 0 var(--sh)}
.tl i{width:58px;height:58px;border-radius:50%;background:#4a3b4e;transition:.2s}
.tl.r .r{background:#ff5a5a;box-shadow:0 0 24px 6px #ff5a5a99}.tl.y .y{background:#ffd23c;box-shadow:0 0 24px 6px #ffd23c99}.tl.g .g{background:#6fe07a;box-shadow:0 0 24px 6px #6fe07a99}
.tlp{width:16px;flex:1;background:var(--ink);border-radius:0 0 4px 4px}
.stop{border:3px solid var(--ink);border-radius:14px;padding:8px;text-align:center;font:600 27px 'Fredoka',sans-serif;background:var(--white);margin:12px 0 8px;box-shadow:0 4px 0 var(--sh)}
.stop.s{background:#ff9a9a}.stop.c{background:var(--mus)}
.bar{height:16px;border:3px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--teal)}
.pc{color:#d2332f;font-weight:700;font-size:1.3em}.pc.c{color:#d78a00}
/* stage 3 */
.tabs{display:flex;gap:6px;padding:0 8px;border-bottom:4px solid var(--ink);margin-bottom:14px;align-items:flex-end}
.tabs button{flex:1;font:600 19px 'Fredoka',sans-serif;border:4px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;padding:7px 6px 4px;transition:padding .15s}
.tabs button:nth-child(1){background:var(--pink)}.tabs button:nth-child(2){background:var(--mus)}.tabs button:nth-child(3){background:var(--sky)}
.tabs .on{padding-bottom:14px}
#s{font-size:34px;line-height:1.7;text-align:center}
.w{transition:color .2s}.w.ok{color:#2c7a3a}.w.no{color:#c33;text-decoration:underline wavy}.w.al{color:#a86200;border-bottom:4px dotted #e0a100}
.w.tp{cursor:pointer;border-bottom:3px dotted #75624e}.w.cur{background:var(--mus);border-radius:6px}
.heard{color:#75624e;font-size:21px;min-height:30px;margin-top:8px}
.mic{display:inline-flex;gap:3px;align-items:flex-end;height:20px;margin-right:8px;vertical-align:-2px}
.mic i{width:6px;height:6px;background:var(--teal);border-radius:3px;animation:micb .7s infinite}.mic i:nth-child(2){animation-delay:.15s}.mic i:nth-child(3){animation-delay:.3s}.mic.on i{background:var(--red)}
@keyframes micb{50%{height:20px}}
.fbk{margin-top:12px;background:var(--white);border:3px solid var(--ink);border-radius:6px 18px 18px 18px;padding:10px 16px;font-size:21px;animation:popin .35s}.fbk:empty{display:none}
.fbk .btn{margin:4px 6px 0 0}.pscore{display:block;font:600 17px 'Fredoka',sans-serif;margin-bottom:2px}
/* stage 4 */
.m4{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1;align-content:start}
.slot,.pool{display:block;width:100%;text-align:left;font-size:21px;line-height:1.25;border:3px solid var(--ink);border-radius:5px;padding:10px 14px;margin-bottom:11px;min-height:68px;background:var(--white);transition:transform .15s}
.slot{border-style:dashed}.slot.has{border-style:solid;background:#c6ebe1;animation:popin .3s}.slot.bad{background:#ff9a9a;animation:shake .4s}
.pool{background:var(--mus);box-shadow:0 4px 0 var(--sh);rotate:-1deg}.pool:nth-child(even){background:var(--pink);rotate:1.2deg}
.pool:hover{transform:translateX(-8px) scale(1.03)}.slot.has:hover{transform:scale(1.02)}
/* stage 5 */
.panel.p5{background:radial-gradient(#0002 1px,transparent 1.5px) 0 0/9px 9px,#b98b5a;box-shadow:0 0 0 8px #7a4f36,0 0 0 12px var(--ink),0 20px 0 var(--sh);border-radius:5px;padding:26px 22px 14px}
.pols{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pol{position:relative;background:var(--white);border:3px solid var(--ink);padding:8px 8px 4px;text-align:center;font-size:19px;line-height:1.1;box-shadow:0 5px 0 var(--sh);rotate:-2deg;transition:transform .15s}
.pol:nth-child(even){rotate:2.2deg}.pol:hover{transform:translateY(-6px) scale(1.04)}
.pol .ph{background:#a8d8cd;border:2px solid var(--ink);padding-top:4px}.pol .ph svg{height:104px;display:block;margin:auto;filter:url(#wob)}
.pol small{display:block;font-size:15px;color:#75624e}
.pol:before,.st:before{content:'';position:absolute;top:-11px;left:calc(50% - 30px);width:60px;height:19px;background:var(--tape);transform:rotate(-4deg)}
.pol.sel{outline:6px solid var(--red);outline-offset:2px}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 14px;margin-top:22px}
.st{position:relative;text-align:left;font-size:18px;line-height:1.2;background:var(--mus);border:3px solid var(--ink);padding:12px 10px 8px;box-shadow:0 4px 0 var(--sh);rotate:-1deg;transition:transform .15s}
.st:nth-child(2){background:var(--pink);rotate:1deg}.st:nth-child(3){background:var(--sky)}.st:nth-child(4){background:var(--grn);rotate:1.4deg}
.st:hover{transform:scale(1.04)}.st.sel{outline:6px solid var(--teal);outline-offset:2px}
.stm{position:relative;margin-top:22px;font-size:20px;line-height:1.5;padding:8px 14px}
.stm .lb{position:absolute;top:-17px;left:12px;font:14px 'Special Elite',monospace;background:var(--ink);color:var(--paper);padding:2px 12px 0;rotate:-1.5deg}
.solve{margin-top:auto;font:700 26px 'Fredoka',sans-serif;letter-spacing:2px;background:var(--red);color:var(--white);border:4px solid var(--ink);border-radius:999px;padding:9px;box-shadow:0 6px 0 var(--ink);outline:2px dashed rgba(255,253,246,.7);outline-offset:-10px;transition:transform .12s}
.solve:hover{transform:translateY(-3px) scale(1.01)}.solve:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
/* ---------- chapter card ---------- */
.chap{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(21,12,29,.72);cursor:pointer;perspective:1800px;transition:background .6s}
.chap .pg{width:600px;padding:44px 40px 34px 84px;text-align:center;rotate:-2deg;border:4px solid var(--ink);border-radius:6px 20px 20px 6px;box-shadow:0 12px 0 var(--sh);transform-origin:left center;animation:pgin .6s cubic-bezier(.3,1.3,.5,1) both;background:linear-gradient(90deg,transparent 16px,#8d979a 16px 32px,transparent 32px) 0 11px/48px 36px repeat-y,radial-gradient(circle at 38px 18px,var(--night) 0 7px,transparent 8px) 0 0/56px 36px repeat-y,linear-gradient(90deg,transparent 62px,rgba(232,93,117,.45) 62px 64px,transparent 64px),linear-gradient(transparent 31px,rgba(63,165,156,.16) 31px) 0 14px/100% 33px,var(--paper)}
@keyframes pgin{from{transform:translateY(700px) rotate(14deg)}}
.chap.go{background:transparent;pointer-events:none}.chap.go .pg{animation:pgflip .75s ease-in both}
@keyframes pgflip{to{transform:rotateY(-115deg);opacity:0}}
.ctag{display:inline-block;background:var(--pink);border:4px solid var(--ink);border-radius:12px 12px 0 0;padding:6px 24px 2px;font:21px 'Special Elite',monospace;rotate:-2deg;animation:stamp .4s .5s both}
@keyframes stamp{from{transform:scale(3);opacity:0}}
.cem{font-size:112px;line-height:1.15;margin-top:8px;filter:drop-shadow(0 5px 0 var(--sh));animation:bob 1.8s infinite}
.chap h1{font-size:60px}.chap p{font-size:28px;margin:6px 0 18px}

function sim(a,b){if(a==b)return 1;const pa=ph(a),pb=ph(b);if(pa==pb)return 1;const f=(x,y)=>1-lev(x,y)/Math.max(x.length,y.length,1),k=p=>p.replace(/[aeiou]+/g,'a');return .6*f(pa,pb)+.4*f(k(pa),k(pb))}
function toks(t,c){const w=nrm(t),o=w.map(x=>({w:x,c}));for(let k=0;k+1<w.length;k++)o.push({w:w[k]+w[k+1],c});return o}
// each word: 'ok' = heard clearly, 'al' = sounded close / recogniser unsure, 'no' = not heard
function evalRead(tg,fin,interim){let P=[],Q=[];fin.forEach(f=>{P=P.concat(toks(f.t,f.c));(f.a||[]).forEach(a=>{Q=Q.concat(toks(a,0))})});if(interim)P=P.concat(toks(interim,0));
const best=(L,t)=>L.reduce((m,x)=>{const s=sim(t,x.w);return s>m.s?{s,c:x.c}:m},{s:0,c:0});
const st=tg.map(t=>{const p=best(P,t),q=best(Q,t);return p.s>=.905?(p.c>0&&p.c<.45?'al':'ok'):(q.s>=.905||p.s>=.55)?'al':'no'});
tg.forEach((t,k)=>{if(t.length<=2&&st[k]=='no'&&(k==0||st[k-1]=='ok')&&(k==tg.length-1||st[k+1]=='ok'))st[k]='ok'});return st}

function m1(){F1=new Set();const re=new RegExp('\\b('+Object.keys(D).join('|')+')\\b','gi');const p=TXT.join(' ').replace(re,m=>`<button class="kw" data-k="${m.toLowerCase()}" onclick="w('${m.toLowerCase()}')">${m}</button>`);
lv(1,'Case file I · Museum',`<div class="pp">${p}</div><div class="row end"><button class="btn b" onclick="say(TXT.join(' '))">🔊 Listen</button><b id="cnt">Words found 0/8</b><span class="sp"></span><button class="btn g" id="fin1" disabled onclick="reward(1,12)">Finish</button></div>`,'Tap every underlined word. My magnifying glass shows what it means!')}
function w(k){const d=D[k];F1.add(k);if(!S.words.includes(k))S.words.push(k);$$('.kw[data-k="'+k+'"]').forEach(e=>e.classList.add('f'));$('#cnt').textContent=`Words found ${F1.size}/8`;if(F1.size==8)$('#fin1').disabled=false;
openModal(`<div class="lens"><i class="hd"></i><div class="glass"><div class="em">${d[0]}</div><h2>${k}</h2><p>${d[1]}</p></div><div class="row c"><button class="btn b" onclick="say('${k}. ${d[1]}')">🔊 Hear it</button><button class="btn" onclick="closeModal()">Close</button></div></div>`);say(k)}
// ----- II · Crossroads: punctuation stop signs -----
let P;
function m2(){const ch=TXT.join(' ').match(/[^,.]+[,.]/g).map(s=>s.trim());P={ch,i:0,lock:false,mist:0};
lv(2,'Case file II · Crossroads',`<div class="m2"><div class="pp" id="rd"></div><div class="tlb"><div class="tl" id="tl"><i class="r"></i><i class="y"></i><i class="g"></i></div><i class="tlp"></i></div></div><div class="stop" id="sg">Press Read to start</div><div class="bar"><i id="pb"></i></div><div class="row end"><button class="btn" id="go" onclick="nx()">Read 👣</button></div>`,'Read one chunk at a time. 🟡 comma = slow down. 🛑 full stop = stop and count!')}
function nx(){if(P.lock){P.mist++;SFX.bad();duckDo('no');return toast('Wait! Count at the sign first.')}
if(P.i>=P.ch.length)return reward(2,Math.max(4,12-2*P.mist));
const c=P.ch[P.i++],pu=c.slice(-1),cm=pu==',';
$('#rd').insertAdjacentHTML('beforeend',c.slice(0,-1)+`<span class="pc ${cm?'c':''}">${pu}</span> `);say(c);
P.lock=true;$('#go').textContent='Counting…';const sg=$('#sg');sg.className='stop '+(cm?'c':'s');sg.textContent=cm?'🟡 Slow down… 1':'🛑 STOP! Count 1… 2…';$('#tl').className='tl '+(cm?'y':'r');
const ms=cm?1400:2400,pb=$('#pb');pb.style.transition='none';pb.style.width='0';setTimeout(()=>{pb.style.transition=`width ${ms}ms linear`;pb.style.width='100%'},30);
setTimeout(()=>{P.lock=false;const sg=$('#sg');if(!sg)return;beep(900);sg.className='stop';sg.textContent='✅ Go!';$('#tl').className='tl g';$('#go').textContent=P.i>=P.ch.length?'Finish':'Read 👣'},ms+400)}
// ----- III · Police: read aloud, pronunciation check -----
let R,M3=0;const SR=window.SpeechRecognition||window.webkitSpeechRecognition,MOB=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent),SEN=[TXT[1],TXT[2],TXT[4]];
function m3(){R={ok:{},sc:[0,0,0],res:{},man:{}};M3=0;lv(3,'Case file III · Police','',SR?'Press 🎤 Start, read the sentence out loud, then press ⏹ Done. I will listen!':'Read the sentence out loud. Then tap the words that were hard and I will help you!');m3r()}
function m3r(){const i=M3,rs=R.res[i];pin(`<div class="tabs">${SEN.map((_,k)=>`<button class="${k==i?'on':''}" onclick="m3go(${k})">Statement ${k+1}${R.ok[k]?' ✔':''}</button>`).join('')}</div>
<div class="pp" id="s">${SEN[i].split(' ').map((x,k)=>`<span class="w ${rs?rs.st[k]:''}">${x}</span>`).join(' ')}</div><div class="heard" id="h"></div>
<div class="row c"><button class="btn b" onclick="lis()">🔊 Listen</button><button class="btn" id="mb" onclick="rec()">${rs?'🔁 Try again':SR&&!R.man[i]?'🎤 Start':'✅ I read it'}</button></div><div class="fbk" id="fb">${rs?rs.fb:''}</div>
<div class="row end"><button class="btn g" id="fin3" ${Object.keys(R.ok).length==3?'':'disabled'} onclick="reward(3,R.sc.reduce((a,b)=>a+b,0)+3)">Finish</button></div>`)}
function m3go(k){stopL();hush();M3=k;SFX.tick();m3r()}
function stopL(){if(LS){const s=LS;LS=null;try{s.r.abort()}catch(e){}mDuck(1)}}
function lis(){say(SEN[M3]);const ws=$$('#s .w');ws.forEach((e,j)=>setTimeout(()=>{ws.forEach(x=>x.classList.remove('cur'));e.classList.add('cur')},350+j*430));setTimeout(()=>ws.forEach(x=>x.classList.remove('cur')),350+ws.length*430)}
function tgt(){const ws=$$('#s .w');return{ws,tg:ws.map(e=>nrm(e.textContent).join(''))}}
function stat(h,on){const e=$('#h');if(e)e.innerHTML=`<span class="mic ${on?'on':''}"><i></i><i></i><i></i></span>${h}`}
function rec(){const i=M3,b=$('#mb');if(LS){LS.stop=1;try{LS.r.stop()}catch(e){}return}
if(R.res[i]){delete R.res[i];return m3r()}
if(b.dataset.chk)return chk();if(!SR||R.man[i])return manual();
hush();const s=LS={i,fin:[],interim:'',stop:0,heard:0,fatal:'',n:0,t0:Date.now(),r:null};mDuck(0);
let r;try{r=new SR}catch(e){LS=null;mDuck(1);return manual()}
s.r=r;r.lang='en-US';r.interimResults=true;r.continuous=!MOB;r.maxAlternatives=4;
r.onsoundstart=r.onspeechstart=()=>{if(LS!==s)return;s.heard=1;if(!s.fin.length&&!s.interim)stat('👂 I can hear your voice!',1)};
r.onresult=e=>{if(LS!==s)return;s.heard=1;let it='';for(let k=e.resultIndex;k<e.results.length;k++){const x=e.results[k];if(x.isFinal)s.fin.push({t:x[0].transcript,c:x[0].confidence||0,a:[...x].slice(1).map(y=>y.transcript)});else it+=x[0].transcript+' '}s.interim=it;live(s)};
r.onerror=e=>{if(e.error!='no-speech'&&e.error!='aborted')s.fatal=e.error};
r.onend=()=>{if(LS!==s)return;if(s.fatal)return failL(s);if(!s.stop&&s.n++<40&&Date.now()-s.t0<45000){try{r.start();return}catch(e){return setTimeout(()=>{if(LS!==s)return;try{r.start()}catch(e2){finishL(s)}},300)}}finishL(s)};
try{r.start();b.textContent='⏹ Done';stat('🎤 Listening… read now!')}catch(e){s.fatal='start';failL(s)}}
function live(s){const {ws,tg}=tgt(),st=evalRead(tg,s.fin,s.interim);ws.forEach((e,k)=>e.className='w'+(st[k]=='ok'?' ok':''));
stat('🦆 I hear: '+(s.fin.map(f=>f.t).join(' ')+' '+s.interim).trim(),1);if(!s.interim&&st.every(x=>x=='ok')&&!s.stop){s.stop=1;try{s.r.stop()}catch(e){}}}
function endL(){LS=null;mDuck(1);const b=$('#mb');if(b)b.textContent='🎤 Start';return b}
function failL(s){if(!endL())return;const c=s.fatal;toast(c=='audio-capture'?'No microphone found. Use Duck check instead.':c=='network'?'The listening service is not reachable. Use Duck check instead.':'Mic is blocked here. Use Duck check instead.');manual()}
function finishL(s){if(!endL())return;if(s.interim.trim())s.fin.push({t:s.interim,c:0,a:[]});
if(!s.fin.length){$('#h').textContent=s.heard?'I heard a sound, but no words. Come closer to the microphone and speak up!':'No sound came from the microphone. Check that it is switched on and allowed.';return toast('I did not hear you. Try again!')}
done(evalRead(tgt().tg,s.fin,''),1)}
function manual(){R.man[M3]=1;$('#h').textContent='Tap the words that were hard for you. Then press Duck check.';$$('#s .w').forEach(e=>{e.classList.add('tp');e.onclick=()=>e.classList.toggle('no')});const b=$('#mb');b.textContent='🦆 Duck check';b.dataset.chk=1}
function chk(){done($$('#s .w').map(e=>e.classList.contains('no')?'no':'ok'),0)}
function done(st,mic){const i=M3,wd=$$('#s .w').map(e=>e.textContent.replace(/[^\w’']/g,'')),n=st.length,miss=wd.filter((_,k)=>st[k]=='no'),alm=wd.filter((_,k)=>st[k]=='al');
R.sc[i]=Math.max(0,Math.round((n-miss.length-alm.length*.5)/n*4));R.ok[i]=1;const pr=[...new Set([...alm,...miss])],nxt=[0,1,2].find(k=>!R.ok[k]);
const sc=mic?`<span class="pscore">🟢 ${n-miss.length-alm.length} clear &nbsp; 🟡 ${alm.length} almost &nbsp; 🔴 ${miss.length} not heard</span>`:'';
const fb=sc+(pr.length?`Good try! Let us practise: ${pr.map(x=>`<button class="btn b s" onclick="say('${x}')">🔊 ${x}</button>`).join('')}<br>Listen, then say each word 3 times.`:'Perfect reading! Quack quack! ⭐')+(nxt!=null?` <button class="btn s" onclick="m3go(${nxt})">Next ▶</button>`:'');
R.res[i]={st,fb};m3r();pr.length?beep(500):SFX.ok();duckDo(pr.length?'no':'yay');say(pr.length?'Good try! Practise '+pr.join(', '):'Perfect reading!')}
// ----- IV · Library: timeline -----
function m4(){T=[null,null,null,null,null];lv(4,'Case file IV · Timeline','','Tap the clue cards in the order things happened. Tap a placed card to remove it.');tl()}
function tl(bad=[]){const used=T.filter(x=>x!==null);pin(`<div class="m4"><div>${T.map((x,k)=>`<button class="slot ${x!==null?'has':''} ${bad.includes(k)?'bad':''}" onclick="rm(${k})"><b>${k+1}.</b> ${x!==null?EV[x]:'…'}</button>`).join('')}</div><div>${SH.filter(x=>!used.includes(x)).map(x=>`<button class="pool" onclick="pl(${x})">🧩 ${EV[x]}</button>`).join('')}</div></div><div class="row end"><button class="btn g" ${used.length==5?'':'disabled'} onclick="ck()">Check order</button></div>`)}
function pl(x){const k=T.indexOf(null);if(k<0)return;T[k]=x;SFX.pop();tl()}
function rm(k){T[k]=null;SFX.tick();tl()}
function ck(){const bad=T.map((x,k)=>x!==k?k:-1).filter(k=>k>=0);if(!bad.length)return reward(4,15);SFX.bad();duckDo('no');tl(bad);toast(`${5-bad.length}/5 correct. Fix the red cards!`);bad.forEach(k=>T[k]=null)}
// ----- V · Town Hall: name the thief -----
function m5(){Q={s:null,e:new Set(),m:0};lv(5,'Case file V · Town Hall','','Who took the Golden Quill? Pin a suspect and the clues that prove it!');dd()}
function dd(){pin(`<div class="pols">${SU.map((s,i)=>`<button class="pol ${Q.s===i?'sel':''}" onclick="Q.s=${i};SFX.pop();dd()"><div class="ph">${CAST[CN[i]]}</div><b>${s[1]}</b><small>${s[2]}</small></button>`).join('')}</div><div class="sts">${EVS.map((e,i)=>`<button class="st ${Q.e.has(i)?'sel':''}" onclick="Q.e.has(${i})?Q.e.delete(${i}):Q.e.add(${i});SFX.tick();dd()">${Q.e.has(i)?'☑':'☐'} ${e[0]}</button>`).join('')}</div><div class="pp stm"><span class="lb">Statement</span>I think <b>${Q.s!==null?SU[Q.s][1]:'______'}</b> took the Golden Quill because ${[...Q.e].map(i=>EVS[i][0].replace(/\.$/,'').toLowerCase()).join(' and ')||'______'}.</div><button class="solve" onclick="acc()">SOLVE CASE</button>`)}
function acc(){if(Q.s===null||Q.e.size<2)return toast('Pin a suspect and at least 2 clues.');
if([...Q.e].some(i=>!EVS[i][1])){Q.m++;SFX.bad();duckDo('no');return toast('One clue is not in the case report!')}
if(Q.s!==3){Q.m++;SFX.bad();duckDo('no');return toast('Not this suspect. Check the clues again!')}
reward(5,Math.max(8,20-Q.m*4))}
// ===== rewards + ending =====
const conf=()=>`<div class="conf">${[...Array(46)].map((_,i)=>`<i style="left:${Math.random()*1280|0}px;background:${['#ffcf5c','#ff9fb5','#8fc7f5','#a8d98a','#e85d75'][i%5]};animation-duration:${2.4+Math.random()*2.6}s;animation-delay:${-Math.random()*5}s"></i>`).join('')}</div>`;
function reward(n,st){if(BUSY)return;const again=S.done[n];if(!again){S.done[n]=1;S.stars+=st;S.clues.push(CL[n-1]);S.badges.push(BD[n-1]);save()}
go(()=>{HUDOFF=0;scr(`<div class="bg room"></div><div class="dimr"></div>${conf()}${spr('duck')}${spr('pip')}<div class="rw"><div class="trophy">🎉</div><h2>Clue collected!</h2><p class="cl">${CL[n-1]}</p><p class="gain">+${again?0:st} ⭐ &nbsp; <span class="stampb">${BD[n-1]}</span></p><button class="btn g" onclick="go(map)">Back to the map</button></div>`,'rws');SFX.ok();$('#hst').classList.add('bump');say('Quack quack! Clue collected!')})}
function end(){HUDOFF=0;scr(`<div class="bg room"></div><div class="dimr"></div>${conf()}${spr('duck')}${spr('crow','dim')}<div class="rw fin"><div class="trophy">🏆</div><h2>Case closed!</h2><p class="cl">Mr. Crow took the Golden Quill. The Quackford police have it back!</p><h1 class="big">${S.stars} ⭐</h1><h3>${rank()}</h3><div class="badges">${S.badges.map((b,i)=>`<span style="animation-delay:${.5+i*.15}s">${b}</span>`).join('')}</div><div class="row c"><button class="btn" onclick="reset();DP={x:80,y:640};go(menu)">Play again</button><button class="btn b" onclick="nb()">📓 My words</button></div></div>`,'rws');SFX.ok();say('Case closed! Great job, detective!')}
// ===== boot =====
$('#stage').addEventListener('mousemove',e=>{const r=$('#stage').getBoundingClientRect(),s=$('#scr').style;s.setProperty('--mx',((e.clientX-r.left)/r.width*2-1).toFixed(3));s.setProperty('--my',((e.clientY-r.top)/r.height*2-1).toFixed(3))});
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.contains(e.relatedTarget)&&!b.disabled)SFX.tick()});
document.addEventListener('pointerdown',()=>{mInit();if(mOn&&!mT)mStart()});
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():mOn&&AC.resume()});
load();fit();menu();setTimeout(()=>$('#iris').classList.remove('shut'),250);
</script></body></html>
